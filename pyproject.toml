[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercoreg"
version = "0.5.0"
description = "Automated hyperspectral PRISMA/EnMAP to Sentinel-2 coregistration"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "HyperCoreg Contributors"}
]
keywords = [
    "remote sensing",
    "coregistration",
    "hyperspectral",
    "PRISMA",
    "EnMAP",
    "Sentinel-2",
    "image registration",
    "geospatial",
    "satellite imagery"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.20",
    "h5py>=3.0",
    "rasterio>=1.3",
    "geoarray>=0.15",
    "arosics>=1.8",
    "shapely>=2.0",
    "pyproj>=3.0",
    "requests>=2.25",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "scipy>=1.7",
    "pandas>=1.3",
    "geopandas>=0.10",
]

[project.scripts]
hypercoreg = "hypercoreg.cli:main"
hypercoreg-gui = "hypercoreg.gui:main"

[project.urls]
Homepage = "https://github.com/AntoniogamezG/HyperCoreg-An-optimized-hyperspectral-to-Sentinel-2-co-registration-pipeline-for-PRISMA-and-EnMAP"
Documentation = "https://github.com/AntoniogamezG/HyperCoreg-An-optimized-hyperspectral-to-Sentinel-2-co-registration-pipeline-for-PRISMA-and-EnMAP#readme"
Repository = "https://github.com/AntoniogamezG/HyperCoreg-An-optimized-hyperspectral-to-Sentinel-2-co-registration-pipeline-for-PRISMA-and-EnMAP"
Issues = "https://github.com/AntoniogamezG/HyperCoreg-An-optimized-hyperspectral-to-Sentinel-2-co-registration-pipeline-for-PRISMA-and-EnMAP/issues"
Changelog = "https://github.com/AntoniogamezG/HyperCoreg-An-optimized-hyperspectral-to-Sentinel-2-co-registration-pipeline-for-PRISMA-and-EnMAP/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hypercoreg*"]

[tool.setuptools.package-data]
hypercoreg = ["py.typed", "data/*.csv"]
